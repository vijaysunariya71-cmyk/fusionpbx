<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion PBX Forward - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#38bdf8',
                        'accent-dark': '#0284c7'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .glow {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body class="bg-dark text-slate-300 font-sans antialiased min-h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-card border-r border-slate-700 hidden md:flex flex-col justify-between transition-all duration-300">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <svg class="w-8 h-8 text-accent mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <h1 class="text-lg font-bold text-white tracking-wide">Fusion PBX<br><span class="text-xs text-accent uppercase tracking-widest font-medium">Forward</span></h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="#" class="flex items-center px-4 py-3 bg-slate-800 text-accent rounded-lg border border-slate-700 shadow-sm transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Live Campaigns
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800/50 hover:text-white rounded-lg transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    Call Routing
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800/50 hover:text-white rounded-lg transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Reports
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800/50 hover:text-white rounded-lg transition-colors">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold border border-slate-600">
                    AD
                </div>
                <div>
                    <p class="text-sm font-medium text-white">Admin User</p>
                    <p class="text-xs text-emerald-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> Online
                    </p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-card border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 lg:px-8 z-10 shadow-sm">
            <div class="flex items-center md:hidden">
                <h1 class="text-lg font-bold text-white tracking-wide flex items-center">
                    <svg class="w-6 h-6 text-accent mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Fusion PBX
                </h1>
            </div>
            
            <div class="hidden md:flex items-center">
                <h2 class="text-xl font-semibold text-white">Real-Time Campaign Monitor</h2>
            </div>

            <div class="flex items-center gap-6">
                <div class="hidden sm:flex items-center gap-2">
                    <span class="text-sm text-slate-400">Network Status:</span>
                    <span class="px-2 py-1 rounded bg-emerald-500/10 text-emerald-400 text-xs font-medium border border-emerald-500/20 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        STABLE
                    </span>
                </div>
                <div class="text-sm text-slate-400 font-mono hidden lg:block" id="clock">
                    --:--:--
                </div>
            </div>
        </header>

        <!-- Global Stats Row (Optional but adds to the telecom feel) -->
        <div class="bg-slate-900/50 border-b border-slate-800 px-4 sm:px-6 lg:px-8 py-4 flex grid grid-cols-2 md:grid-cols-4 gap-4 z-0">
            <div class="bg-card rounded-lg p-3 border border-slate-700 shadow-sm">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Total Campaigns</p>
                <p class="text-xl font-bold text-white">16</p>
            </div>
            <div class="bg-card rounded-lg p-3 border border-slate-700 shadow-sm">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Global Active Calls</p>
                <p class="text-xl font-bold text-accent font-mono" id="global-active-calls">--</p>
            </div>
            <div class="bg-card rounded-lg p-3 border border-slate-700 shadow-sm hidden md:block">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">System Load</p>
                <div class="w-full bg-slate-800 rounded-full h-2.5 mt-2">
                    <div class="bg-emerald-500 h-2.5 rounded-full" style="width: 45%"></div>
                </div>
            </div>
            <div class="bg-card rounded-lg p-3 border border-slate-700 shadow-sm hidden md:block">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Avg Global AHT</p>
                <p class="text-xl font-bold text-purple-400 font-mono">~45m 00s</p>
            </div>
        </div>

        <!-- Campaign Grid -->
        <div class="flex-1 overflow-y-auto p-4 sm:px-6 lg:px-8 pb-20">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="campaign-grid">
                <!-- Cards will be injected here via JavaScript -->
            </div>
        </div>
    </main>

    <script>
        // Array of predefined campaigns
        const campaigns = [
            "✨ Cashapp",
            "🛒📦 Amazon eCommerce",
            "🎬🛍️ Amazon Prime Activation",
            "📺🌐 Roku OTT",
            "🚨🚨 McAfee antivirus",
            "🛍️📦 eBay",
            "🏦💳 Banking Wells Fargo",
            "📈💰 Robinhood Crypto",
            "🔐💱 Coinbase",
            "💸🛒 Paypal PPC",
            "🖨️🖱️ Printer",
            "💻📊 Microsoft PPC",
            "📚💼 QuickBooks",
            "💻🔴💥 BSOD Porn Popup",
            "🚫👶🛑 BSOD Age Filter",
            "💻 📱 📱 Ios Popup Age filter"
        ];

        // State object to hold current values
        const campaignData = {};

        // Helper functions
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Generate AHT strictly > 30 mins (between 31m 00s and 59m 59s)
        function generateAHT() {
            const minutes = getRandomInt(31, 59);
            const seconds = getRandomInt(0, 59);
            const padSeconds = seconds.toString().padStart(2, '0');
            return `${minutes}m ${padSeconds}s`;
        }

        // Initialize Data
        campaigns.forEach((name, index) => {
            campaignData[index] = {
                name: name,
                activeCalls: getRandomInt(2, 50),
                aht: generateAHT() // AHT is set once to a random value > 30m
            };
        });

        const gridContainer = document.getElementById('campaign-grid');

        // Render Cards
        function renderCards() {
            gridContainer.innerHTML = ''; // Clear container

            campaigns.forEach((name, index) => {
                const data = campaignData[index];
                
                const cardHTML = `
                    <div class="bg-card rounded-xl p-5 border border-slate-700 glow hover:border-slate-500 transition-colors duration-300 flex flex-col h-full relative group">
                        <!-- Live Indicator -->
                        <div class="absolute top-5 right-5 flex items-center gap-2">
                            <span class="text-[10px] text-slate-500 font-bold tracking-wider uppercase group-hover:text-slate-400 transition-colors">Live</span>
                            <span class="flex h-2.5 w-2.5 relative">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                            </span>
                        </div>

                        <!-- Campaign Name -->
                        <div class="mb-6 pr-12">
                            <h3 class="text-base sm:text-lg font-semibold text-white leading-snug">${data.name}</h3>
                        </div>

                        <!-- Metrics Grid -->
                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <div class="bg-slate-800/50 rounded-lg p-3 text-center border border-slate-700/50 flex flex-col justify-center">
                                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mb-1 font-semibold">Active Calls</p>
                                <p class="text-2xl sm:text-3xl font-bold text-accent font-mono active-call-display" id="calls-${index}">
                                    ${data.activeCalls}
                                </p>
                            </div>
                            <div class="bg-slate-800/50 rounded-lg p-3 text-center border border-slate-700/50 flex flex-col justify-center">
                                <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider mb-1 font-semibold">AHT</p>
                                <p class="text-lg sm:text-xl font-bold text-purple-400 font-mono">
                                    ${data.aht}
                                </p>
                            </div>
                        </div>
                        
                        <!-- Progress bar decoration mimicking SLA/Capacity -->
                        <div class="w-full bg-slate-800 h-1 mt-4 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-accent to-purple-500 h-full opacity-50" style="width: ${Math.min((data.activeCalls / 50) * 100, 100)}%" id="progress-${index}"></div>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
            updateGlobalCalls();
        }

        // Update logic for active calls
        function fluctuateCalls() {
            // Pick a few random campaigns to update every interval to make it look realistic
            const numberOfUpdates = getRandomInt(3, 8);
            for(let i=0; i < numberOfUpdates; i++) {
                const randIndex = getRandomInt(0, campaigns.length - 1);
                
                // Fluctuate between 2 and 50
                // We add a small delta (+- 5) but clamp it between 2 and 50
                let currentCalls = campaignData[randIndex].activeCalls;
                const change = getRandomInt(-5, 5);
                let newCalls = currentCalls + change;
                
                if (newCalls < 2) newCalls = 2;
                if (newCalls > 50) newCalls = 50;

                // Occasional sudden spikes or drops for realism
                if(Math.random() > 0.9) {
                    newCalls = getRandomInt(2, 50);
                }
                
                campaignData[randIndex].activeCalls = newCalls;
                
                // Update DOM directly for performance instead of full re-render
                const callElement = document.getElementById(`calls-${randIndex}`);
                const progressElement = document.getElementById(`progress-${randIndex}`);
                
                if(callElement && progressElement) {
                    // Flash effect on update
                    callElement.classList.remove('text-accent');
                    callElement.classList.add('text-white', 'scale-110');
                    
                    setTimeout(() => {
                        callElement.innerText = newCalls;
                        progressElement.style.width = `${Math.min((newCalls / 50) * 100, 100)}%`;
                        callElement.classList.remove('text-white', 'scale-110');
                        callElement.classList.add('text-accent');
                        callElement.style.transition = 'all 0.3s ease';
                    }, 150);
                }
            }
            updateGlobalCalls();
        }

        function updateGlobalCalls() {
            let total = 0;
            for(let key in campaignData) {
                total += campaignData[key].activeCalls;
            }
            const globalEl = document.getElementById('global-active-calls');
            if(globalEl) {
                globalEl.innerText = total;
            }
        }

        // Clock logic
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }

        // Initialization
        window.onload = () => {
            renderCards();
            
            // Set intervals for realistic PBX behavior
            setInterval(fluctuateCalls, 2500); // Fluctuate calls every 2.5 seconds
            
            // Clock tick
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
